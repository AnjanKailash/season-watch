name: Daily market refresh
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"   # every 10 min in US market hours (Mon–Fri): latest prices only
    - cron: "30 12 * * 1-5"        # 6:00 pm India time, Mon–Fri: full analysis before US market opens
  workflow_dispatch: {}            # "Run workflow" button = full analysis
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python refresh.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.schedule == '*/10 13-21 * * 1-5' && 'prices' || 'full' }}
