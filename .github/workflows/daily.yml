name: Daily market refresh
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"   # every 10 min in US market hours: latest prices only
    - cron: "30 1 * * 2-6"         # 7:00 am India time: full analysis, cycles, momentum, news
  workflow_dispatch: {}            # "Run workflow" button = full analysis
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python refresh.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: ${{ github.event.schedule == '*/10 13-21 * * 1-5' && 'prices' || 'full' }}
