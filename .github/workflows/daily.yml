name: Daily market refresh
on:
  schedule:
    - cron: "*/10 13-21 * * 1-5"   # every 10 min in US market hours (Mon–Fri): latest prices only
    - cron: "0 13 * * 1-5"         # 6:30 pm India time, Mon–Fri: full analysis + WhatsApp list
    - cron: "40 13 * * 1-5"        # 7:10 pm backup (runs only if nothing ran yet today)
    - cron: "20 14 * * 1-5"        # 7:50 pm backup
  workflow_dispatch:               # "Run workflow" button, or the cron-job.org trigger
    inputs:
      source:
        description: "manual or cron"
        required: false
        default: "manual"
concurrency:                       # price checks and the full analysis queue separately,
  group: ${{ github.event.schedule == '*/10 13-21 * * 1-5' && 'prices' || 'full' }}   # so a price check never cancels the daily run
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python refresh.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GREENAPI_URL: ${{ secrets.GREENAPI_URL }}
          GREENAPI_ID: ${{ secrets.GREENAPI_ID }}
          GREENAPI_TOKEN: ${{ secrets.GREENAPI_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          ALERT_MODE: ${{ vars.ALERT_MODE }}
          MAX_DAILY_MESSAGES: ${{ vars.MAX_DAILY_MESSAGES }}
          BUYZONE_TOP_N: ${{ vars.BUYZONE_TOP_N }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
          SCAN_SIZE: ${{ vars.SCAN_SIZE }}
          EVENT: ${{ inputs.source == 'cron' && 'cron' || github.event_name }}
          MODE: ${{ github.event.schedule == '*/10 13-21 * * 1-5' && 'prices' || 'full' }}
